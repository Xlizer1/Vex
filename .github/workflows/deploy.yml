name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vex:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/vex:latest
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_CONTENT,IMAGE
          script: |
            set -e
            mkdir -p /opt/vex

            printf '%s' "$ENV_CONTENT" > /opt/vex/.env

            cat > /opt/vex/docker-compose.yml << EOF
            services:
              vex:
                image: ${IMAGE}
                container_name: vex
                restart: unless-stopped
                env_file: .env
                depends_on:
                  vex-db:
                    condition: service_healthy
                networks:
                  - vex-network

              vex-db:
                image: postgres:15-alpine
                container_name: vex-db
                restart: unless-stopped
                environment:
                  POSTGRES_DB: vertex
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: \${DB_PASSWORD}
                volumes:
                  - vex-db-data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres -d vertex"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                networks:
                  - vex-network

            volumes:
              vex-db-data:

            networks:
              vex-network:
                driver: bridge
            EOF

            docker pull ${IMAGE}
            docker compose -f /opt/vex/docker-compose.yml up -d --pull always
